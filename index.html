<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>소수의 나눗셈 용사 - 전국구 통합본</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        :root { --p: #b3e5fc; --s: #ffeb3b; --a: #ff5252; --t: #5d4037; --bg: #f0f9ff; }
        * { box-sizing: border-box; }
        body { font-family: 'Jua', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 0; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* 상단 공지 및 로그인 */
        #top-bar { background: #ffffff; padding: 10px; border-bottom: 5px solid var(--p); display: flex; justify-content: center; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 1000; }
        #top-bar input { font-family: 'Jua'; padding: 8px; border: 3px solid var(--p); border-radius: 12px; text-align: center; width: 140px; }
        #notice-banner { background-color: #ffebee; color: #c62828; text-align: center; padding: 10px; font-size: 0.9em; font-weight: bold; border-bottom: 2px solid #ef9a9a; position: relative; }
        
        /* 게임 메인 레이아웃 */
        #game-container { display: flex; width: 100%; max-width: 1100px; margin: 15px auto; padding: 0 15px; gap: 20px; flex: 1; }
        .is-locked { filter: blur(10px) grayscale(100%); pointer-events: none; }
        .panel { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 0 rgba(0,0,0,0.05); border: 6px solid var(--p); }
        .hidden { display: none !important; }
        
        /* 버튼 및 탭 */
        .btn { font-family: 'Jua'; border: none; border-radius: 15px; cursor: pointer; color: white; padding: 10px; transition: 0.2s; }
        .btn-nav { width: 100%; margin-top: 8px; font-size: 1.1em; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .rank-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-family: 'Jua'; cursor: pointer; background: #eee; }
        .tab-btn.active { background: var(--p); color: #1565c0; font-weight: bold; }

        /* 랭킹 리스트 */
        .rank-scroll { display: grid; gap: 10px; max-height: 480px; overflow-y: auto; padding-right: 5px; }
        .card { border: 3px solid var(--p); padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        
        /* 전투 영역 */
        #monster-area { padding: 20px; border-radius: 25px; text-align: center; border: 5px solid #c8e6c9; background: #e8f5e9; margin-bottom: 15px; }
        #problem-box { background: #fff9c4; padding: 20px; border-radius: 20px; text-align: center; font-size: 3.5em; border: 5px solid #fff176; margin-bottom: 20px; }
        #ans-input { font-family: 'Jua'; font-size: 2em; padding: 10px; border-radius: 15px; border: 4px solid var(--p); width: 150px; text-align: center; }

        @media screen and (max-width: 768px) { #game-container { flex-direction: column; } }
    </style>
</head>
<body>

<div id="top-bar">
    <input type="text" id="school-name" placeholder="학교 이름">
    <input type="text" id="user-nick" placeholder="닉네임">
    <button onclick="processLogin()" style="background:var(--a); border:none; border-radius:12px; color:white; padding:10px 25px; cursor:pointer; font-family:'Jua';">모험 시작!</button>
</div>

<div id="notice-banner">
    📢 [긴급] TOP 50 랭킹 확장 & '오늘의 정답왕' 신설! 기록이 이상하면 새로고침(F5) 해주세요! 
    <span onclick="this.parentElement.style.display='none'" style="position:absolute; right:15px; cursor:pointer;">X</span>
</div>

<div id="game-container" class="is-locked">
    <div id="status-panel" class="panel" style="flex: 1;">
        <center>
            <h2 id="disp-nick" style="font-size: 2em; margin: 0;">용사</h2>
            <div style="background:var(--s); padding:5px 20px; border-radius:20px; margin-top:5px; font-size:1.2em;">LV. <span id="disp-lv">1</span></div>
        </center>
        <hr style="border: 1px dashed var(--p); margin: 20px 0;">
        <p>💰 골드: <span id="disp-gold">0</span> G</p>
        <p>🔥 오늘 정답: <span id="disp-today">0</span>개</p>
        <p style="font-size: 0.8em; color: #888;">(오늘의 정답수는 매일 밤 12시 리셋!)</p>
        <hr>
        <button class="btn btn-nav" style="background:#ffa726;" onclick="showScreen('shop')">🏪 만물상점</button>
        <button class="btn btn-nav" style="background:#42a5f5;" onclick="showScreen('rank')">🏆 랭킹보드</button>
        <button class="btn btn-nav" style="background:#66bb6a;" onclick="showScreen('collection')">👾 몬스터 도감</button>
        <button class="btn btn-nav" style="background:#78909c;" onclick="showScreen('battle')">⚔️ 전투복귀</button>
    </div>

    <div id="main-panel" class="panel" style="flex: 2.5;">
        <div id="screen-battle">
            <div id="monster-area">
                <div id="m-name" style="font-size: 1.5em; font-weight:bold; color:#2e7d32;">몬스터 탐색 중...</div>
                <div id="m-sprite" style="font-size: 6em; margin: 10px 0;">🔒</div>
            </div>
            <div id="problem-box"><span id="p-text">1.2 ÷ 0.3</span></div>
            <center>
                <input type="text" id="ans-input" placeholder="정답" onkeypress="if(event.keyCode==13) handleAttack()">
                <button onclick="handleAttack()" style="background:var(--a); color:white; border:none; border-radius:15px; padding:12px 35px; font-size:1.6em; font-family:'Jua'; cursor:pointer; box-shadow: 0 5px 0 #d32f2f; margin-left:10px;">공격!</button>
            </center>
        </div>

        <div id="screen-rank" class="hidden">
            <h2 style="text-align:center; margin-top:0;">🏆 전국 명예의 전당 🏆</h2>
            <div class="rank-tabs">
                <button class="tab-btn active" id="tab-p" onclick="switchRank('p')">👤 개인 TOP 50</button>
                <button class="tab-btn" id="tab-d" onclick="switchRank('d')">🔥 오늘 정답왕</button>
                <button class="tab-btn" id="tab-s" onclick="switchRank('s')">🏫 학교 연합</button>
            </div>
            <div id="rank-p" class="rank-scroll"></div>
            <div id="rank-d" class="rank-scroll hidden"></div>
            <div id="rank-s" class="rank-scroll hidden"></div>
        </div>

        <div id="screen-shop" class="hidden">
            <h2 style="text-align:center;">🏪 만물상점</h2>
            <div id="shop-items" class="rank-scroll">
                <div class="card"><span>🎁 경험치 비약 (500G)</span> <button onclick="buyItem('exp')" class="btn" style="background:var(--a)">구매</button></div>
                <div class="card"><span>⚔️ 전설의 연산검 (2000G)</span> <button onclick="buyItem('atk')" class="btn" style="background:var(--a)">구매</button></div>
            </div>
        </div>

        <div id="screen-collection" class="hidden">
            <h2 style="text-align:center;">👾 몬스터 도감</h2>
            <div id="coll-list" class="rank-scroll" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// [Firebase 설정] 디렉터님 정보를 그대로 사용합니다.
const firebaseConfig = {
    apiKey: "AIzaSyDUADGY2c1Y7BFQQVImgHqX92xjNbdGLXk",
    authDomain: "division-of-fractions.firebaseapp.com",
    projectId: "division-of-fractions",
    databaseURL: "https://division-of-fractions-default-rtdb.asia-southeast1.firebasedatabase.app/",
    storageBucket: "division-of-fractions.firebasestorage.app",
    messagingSenderId: "549398586980",
    appId: "1:549398586980:web:8af75b0d03c87eec39a171"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// [게임 상태 변수]
let p = { school:"", nickname:"", lv:1, gold:0, exp:0, todayAns:0, lastDate:"", collection:{} };
let isLogged = false;
let curProb = { q: "", a: 0 };
let mList = ["소수점 슬라임", "나눗셈 고스트", "분할 골렘", "소수 가시", "소수점 드래곤"];

// [로그인 및 날짜 리셋 로직]
window.processLogin = async function() {
    const s = document.getElementById('school-name').value.trim();
    const n = document.getElementById('user-nick').value.trim();
    if(!s || !n) return alert("학교와 닉네임을 입력해줘!");

    const userID = `${s}-${n}`;
    const today = new Date().toLocaleDateString();
    const snap = await get(ref(db, 'players/' + userID));

    if(snap.exists()) {
        p = snap.val();
        // 💡 핵심: 날짜가 바뀌었으면 오늘 정답수 리셋
        if(p.lastDate !== today) {
            p.todayAns = 0;
            p.lastDate = today;
        }
    } else {
        p = { school:s, nickname:n, lv:1, gold:0, exp:0, todayAns:0, lastDate:today, collection:{} };
    }

    isLogged = true;
    document.getElementById('game-container').classList.remove('is-locked');
    updateUI();
    nextProblem();
    alert(`반갑다, ${p.nickname} 용사여!`);
};

// [전투 로직]
window.handleAttack = function() {
    if(!isLogged) return;
    const ans = parseFloat(document.getElementById('ans-input').value);
    if(ans === curProb.a) {
        p.todayAns++;
        p.gold += 10;
        p.exp += 20;
        if(p.exp >= 100) { p.lv++; p.exp = 0; alert("레벨 업!"); }
        
        // 도감 기록
        const curM = document.getElementById('m-name').innerText;
        p.collection[curM] = (p.collection[curM] || 0) + 1;

        alert("정답! 몬스터 처격!");
        saveData();
        nextProblem();
    } else {
        alert("틀렸어! 다시 풀어보자.");
    }
    document.getElementById('ans-input').value = "";
    updateUI();
};

function nextProblem() {
    const a = (Math.random() * 9 + 1).toFixed(1);
    const b = (Math.random() * 3 + 1).toFixed(1);
    curProb.q = `${(a*b).toFixed(2)} ÷ ${b}`;
    curProb.a = parseFloat(a);
    document.getElementById('p-text').innerText = curProb.q;
    document.getElementById('m-name').innerText = mList[Math.floor(Math.random() * mList.length)];
    document.getElementById('m-sprite').innerText = ["👾","👻","🗿","🌵","🐉"][Math.floor(Math.random()*5)];
}

// [랭킹 로직] - TOP 50 최적화
window.switchRank = function(tab) {
    document.getElementById('rank-p').classList.toggle('hidden', tab !== 'p');
    document.getElementById('rank-d').classList.toggle('hidden', tab !== 'd');
    document.getElementById('rank-s').classList.toggle('hidden', tab !== 's');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    
    if(tab === 'p') renderPersonal();
    else if(tab === 'd') renderDaily();
    else renderSchool();
};

async function renderPersonal() {
    const el = document.getElementById('rank-p');
    el.innerHTML = "로딩 중...";
    const q = query(ref(db, 'players'), orderByChild('lv'), limitToLast(50));
    const snap = await get(q);
    let list = [];
    snap.forEach(c => list.push(c.val()));
    list.sort((a,b) => b.lv - a.lv);
    el.innerHTML = list.map((user, i) => `
        <div class="card"><span><b>${i+1}위</b> ${user.school}-${user.nickname}</span><b>LV.${user.lv}</b></div>
    `).join('');
}

async function renderDaily() {
    const el = document.getElementById('rank-d');
    el.innerHTML = "오늘의 열기 로딩 중...";
    const today = new Date().toLocaleDateString();
    const q = query(ref(db, 'players'), orderByChild('todayAns'), limitToLast(50));
    const snap = await get(q);
    let list = [];
    snap.forEach(c => {
        const u = c.val();
        if(u.lastDate === today && u.todayAns > 0) list.push(u);
    });
    list.sort((a,b) => b.todayAns - a.todayAns);
    el.innerHTML = list.map((user, i) => `
        <div class="card"><span><b>🔥 ${i+1}위</b> ${user.nickname}</span><b>${user.todayAns}개</b></div>
    `).join('');
}

async function renderSchool() {
    const el = document.getElementById('rank-s');
    el.innerHTML = "학교 자부심 로딩 중...";
    const snap = await get(ref(db, 'players'));
    const schools = {};
    snap.forEach(c => {
        const u = c.val();
        schools[u.school] = (schools[u.school] || 0) + u.lv;
    });
    const sorted = Object.entries(schools).sort((a,b) => b[1] - a[1]).slice(0, 30);
    el.innerHTML = sorted.map(([name, score], i) => `
        <div class="card"><span><b>${i+1}위</b> ${name}</span><b>${score} LV</b></div>
    `).join('');
}

// [유틸리티]
function updateUI() {
    document.getElementById('disp-nick').innerText = p.nickname;
    document.getElementById('disp-lv').innerText = p.lv;
    document.getElementById('disp-gold').innerText = p.gold;
    document.getElementById('disp-today').innerText = p.todayAns || 0;
    
    // 도감 업데이트
    const cl = document.getElementById('coll-list');
    cl.innerHTML = Object.entries(p.collection).map(([name, count]) => `
        <div class="card" style="font-size:0.8em; padding:10px;">${name}: ${count}마리</div>
    `).join('') || "<p>아직 도감이 비어있어!</p>";
}

function saveData() {
    set(ref(db, 'players/' + `${p.school}-${p.nickname}`), p);
}

window.showScreen = function(s) {
    document.getElementById('screen-battle').classList.toggle('hidden', s !== 'battle');
    document.getElementById('screen-rank').classList.toggle('hidden', s !== 'rank');
    document.getElementById('screen-shop').classList.toggle('hidden', s !== 'shop');
    document.getElementById('screen-collection').classList.toggle('hidden', s !== 'collection');
    if(s === 'rank') renderPersonal();
};

window.buyItem = function(type) {
    if(type === 'exp' && p.gold >= 500) { p.gold -= 500; p.exp += 50; alert("경험치가 올랐다!"); }
    else if(type === 'atk' && p.gold >= 2000) { p.gold -= 2000; alert("공격력이 강해졌다! (기능 준비중)"); }
    else { alert("골드가 부족해!"); }
    updateUI(); saveData();
};
</script>
</body>
</html>
