<script>
// 🚫 마우스 우클릭 금지
document.addEventListener('contextmenu', e => e.preventDefault());

// 🚫 F12 및 주요 개발자 도구 단축키 금지
document.addEventListener('keydown', function(e) {
    if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
        (e.ctrlKey && e.shiftKey && e.keyCode === 74) || // Ctrl+Shift+J
        (e.ctrlKey && e.keyCode === 85) // Ctrl+U (소스 보기)
    ) {
        e.preventDefault();
        alert("용사는 정정당당하게 승부해야 합니다! 🗡️");
    }
});
</script>

function maskNicknamePlain(nickname) {
    const n = String(nickname || "");
    if (n.length <= 2) return n.length ? n[0] + "★" : "★";
    return n[0] + "★".repeat(n.length - 2) + n[n.length - 1];
}
function leaderboardNicknameDisplay(storedNickname, isSecret) {
    if (isSecret === false) return storedNickname || "";
    const s = String(storedNickname || "");
    if (s.includes("★")) return s;
    return maskNicknamePlain(s);
}

function isValidLoginNick(nick) {
    if (!nick || nick.length > 20) return false;
    return !/[.#$\[\]/\\]/.test(nick);
}

function snapshotBaseline(p) {
    return { lv: p.lv || 1, todayAns: p.todayAns || 0, gold: p.gold || 0, atk: p.atk || 10 };
}

function sanitizePlayer(p) {
    p.lv = Math.max(1, Math.min(9999, Math.floor(p.lv || 1)));
    p.gold = Math.max(0, Math.min(1000000000, Math.floor(p.gold || 0)));
    p.hp = Math.max(0, Math.min(500000, Math.floor(p.hp || 0)));
    p.maxHp = Math.max(10, Math.min(500000, Math.floor(p.maxHp || 100)));
    p.exp = Math.max(0, Math.min(100000, Math.floor(p.exp || 0)));
    p.maxExp = Math.max(1, Math.min(100000, Math.floor(p.maxExp || 50)));
    p.atk = Math.max(1, Math.min(1550, Math.floor(p.atk || 10)));
    if (!ALLOWED_ATK.has(p.atk)) p.atk = 10;
    p.comboRate = Math.max(0, Math.min(120, Math.floor(p.comboRate || 0)));
    p.bonusTime = Math.max(1, Math.min(22, Math.floor(p.bonusTime || 5)));
    p.expBonus = Math.max(0, Math.min(200, Math.floor(p.expBonus || 0)));
    p.todayAns = Math.max(0, Math.min(100000, Math.floor(p.todayAns || 0)));
    p.curCombo = Math.max(0, Math.min(999999, Math.floor(p.curCombo || 0)));
    if (!p.collection || typeof p.collection !== "object") p.collection = {};
    return p;
}

function enforceSaveLimits(p) {
    const b = gameState.saveBaseline;
    if (!b) return true;
    if (p.lv > b.lv + 1) { p.lv = b.lv + 1; }
    if (p.lv < b.lv) p.lv = b.lv;
    if (p.todayAns > b.todayAns + 3) p.todayAns = b.todayAns + 3;
    if (p.todayAns < b.todayAns) p.todayAns = b.todayAns;
    if (p.gold > b.gold + 6000) p.gold = b.gold + 6000;
    if (p.gold < b.gold - 70000) p.gold = Math.max(0, b.gold - 70000);
    return true;
}

// 🛡️ 실시간 킥 기능
function addKillSwitch() {
    const userRef = ref(db, 'players/' + `${gameState.player.school}-${gameState.player.nickname}`);
    onValue(userRef, (snapshot) => {
        if (snapshot.val() && snapshot.val().kick === true) {
            alert("🚫 비정상적인 플레이가 감지되어 접속이 차단되었습니다.");
            location.reload(); 
        }
    });
}

// 👤 로그인 및 출석 로직
window.processLogin = async function() {
    let school = document.getElementById('school-name').value.trim().replace(/\s+/g,'');
    let nick = document.getElementById('user-nick').value.trim();
    if(!school || !nick) return alert("⚠️ 학교와 닉네임을 모두 입력해주세요!");
    if(!isValidLoginNick(nick)) return alert("⚠️ 닉네임은 20자 이하이며 . # $ [ ] / \\ 는 사용할 수 없습니다.");
    
    if(school.endsWith("초")) school += "등학교";
    else if(!school.endsWith("초등학교")) school += "초등학교";
    
    const userId = `${school}-${nick}`;
    try {
        const snap = await get(ref(db, 'players/' + userId));
        const today = new Date().toLocaleDateString();
        
        if(snap.exists()) {
            gameState.player = snap.val();
            if(!gameState.player.collection) gameState.player.collection = {};
            if(gameState.player.lastDate !== today) { gameState.player.todayAns = 0; gameState.player.lastDate = today; }
            alert(`✅ 반갑습니다, ${gameState.player.nickname} 용사님!`);
        } else {
            gameState.player.school = school; gameState.player.nickname = nick; gameState.player.lastDate = today;
            alert("✨ 새로운 모험의 시작을 환영합니다!");
        }
        sanitizePlayer(gameState.player);
        gameState.saveBaseline = snapshotBaseline(gameState.player);
        
        gameState.isLoggedIn = true;
        addKillSwitch();
        document.getElementById('game-container').classList.remove('is-locked');
        document.getElementById('start-button').innerText = "접속 완료";
        document.getElementById('start-button').disabled = true;
        document.getElementById('school-name').disabled = true;
        document.getElementById('user-nick').disabled = true;
        document.getElementById('secret-toggle').checked = gameState.player.isSecret;
        
        updateUI(); spawnMonster(); generateProblem();
    } catch(e) { console.error(e); alert("연결 실패! 인터넷 환경을 확인하세요."); }
};

window.toggleSecret = function() {
    if(!gameState.isLoggedIn) return;
    gameState.player.isSecret = document.getElementById('secret-toggle').checked;
    saveData();
};

// Private(players) + Public(leaderboard). 서버 없이: 클라이언트 검증 + database.rules.json
function saveData() {
    if (!gameState.isLoggedIn) return;
    clearTimeout(saveDataTimer);
    saveDataTimer = setTimeout(flushSaveData, 500);
}

function flushSaveData() {
    if (!gameState.isLoggedIn) return;
    const now = Date.now();
    if (now - gameState.lastSaveAt < 400) return;
    gameState.lastSaveAt = now;

    const p = gameState.player;
    const userId = `${p.school}-${p.nickname}`;
    sanitizePlayer(p);
    enforceSaveLimits(p);

    const fullData = { ...p };
    delete fullData.kick;

    const rankData = {
        lv: p.lv,
        school: p.school,
        nickname: p.isSecret !== false ? maskNicknamePlain(p.nickname) : p.nickname,
        todayAns: p.todayAns || 0,
        lastDate: p.lastDate,
        isSecret: p.isSecret !== false
    };

    const updates = {};
    updates['players/' + userId] = fullData;
    updates['leaderboard/' + userId] = rankData;

    update(ref(db), updates)
        .then(() => { gameState.saveBaseline = snapshotBaseline(p); })
        .catch(() => { alert("저장에 실패했습니다. 잠시 후 다시 시도해 주세요."); });
}
window.saveData = saveData;

function logMessage(msg) {
    const logDiv = document.getElementById('battle-log');
    logDiv.innerHTML = `<div>> ${msg}</div>` + logDiv.innerHTML;
}

// ⚔️ 공격 처리
window.handleAttack = function() {
    if(!gameState.isLoggedIn) return;
    
    // 🛡️ 매크로 방어: 0.3초 미만 공격 무효화
    const now = Date.now();
    if(now - gameState.lastAttackTime < 300) { alert("🤖 경고: 너무 빠른 공격입니다!"); gameState.player.curCombo = 0; updateUI(); return; }
    gameState.lastAttackTime = now;

    const input = document.getElementById('answer-input');
    const userAnswer = parseFloat(input.value.trim());
    if(isNaN(userAnswer)) { input.value = ""; return; }
    
    const p = gameState.player;
    const timeTaken = (Date.now() - gameState.currentProblem.start) / 1000;
    const killedCount = p.collection[gameState.currentMonster.name] || 0;
    
    if(Math.abs(userAnswer - gameState.currentProblem.a) < 0.001) {
        p.curCombo++; 
        p.todayAns++;
        
        let collectionBonus = (killedCount >= 50) ? 1.2 : (killedCount >= 25 ? 1.1 : 1.0);
        let baseAtk = Math.floor(p.atk * collectionBonus);
        let timeBonus = (timeTaken <= p.bonusTime) ? 2 : 1;
        if(timeBonus === 2) logMessage("⚡ 신속 공격! 데미지 2배!");
        
        let comboBonus = 1 + (p.curCombo * (p.comboRate / 100));
        let damage = Math.floor((baseAtk * timeBonus) * comboBonus);
        
        gameState.currentMonster.hp -= damage;
        document.getElementById('m-sprite').classList.add('monster-hit');
        setTimeout(() => document.getElementById('m-sprite').classList.remove('monster-hit'), 400);
        
        logMessage(`🗡️ ${damage} 데미지!`);
        if(gameState.currentMonster.hp <= 0) handleWin(); else generateProblem();
    } else {
        p.curCombo = 0; p.hp -= 15;
        document.getElementById('monster-area').classList.add('screen-flash');
        setTimeout(() => document.getElementById('monster-area').classList.remove('screen-flash'), 400);
        
        logMessage(`😭 오답! -15 HP (정답: ${gameState.currentProblem.a})`);
        if(p.hp <= 0) { alert("체력이 모두 소진되었습니다."); p.hp = 30; } 
        generateProblem();
    }
    input.value = ""; 
    updateUI(); 
    saveData(); 
};

// 💡 1~20레벨 완벽 난이도 분배 (초등 6학년 과정)
function generateProblem() {
    const lv = gameState.player.lv;
    let divisor = Math.floor(Math.random() * 8) + 2; 
    let quotient;

    if (lv <= 20) {
        // 1~20레벨: 소수 첫째 자리 (1.1 ~ 9.9)
        quotient = (Math.floor(Math.random() * 89) + 11) / 10;
    } else {
        // 21레벨 이상: 소수 둘째 자리 (1.01 ~ 9.99)
        quotient = (Math.floor(Math.random() * 899) + 101) / 100;
    }
    
    let dividend = parseFloat((divisor * quotient).toFixed(2));
    gameState.currentProblem = { q: `${dividend} ÷ ${divisor} = ?`, a: quotient, start: Date.now() };
    document.getElementById('p-text').innerText = gameState.currentProblem.q;
    document.getElementById('answer-input').focus();
}

function handleWin() {
    const p = gameState.player;
    const killedCount = p.collection[gameState.currentMonster.name] || 0;
    
    let goldReward = Math.floor(50 * (killedCount >= 50 ? 1.1 : (killedCount >= 10 ? 1.05 : 1.0)));
    let expReward = Math.floor(20 * (1 + (p.expBonus / 100)));
    
    p.gold += goldReward; 
    p.exp += expReward; 
    p.collection[gameState.currentMonster.name] = killedCount + 1; 
    
    if(p.exp >= p.maxExp) {
        p.lv++; p.exp = 0; p.maxExp = 50 + (p.lv * 5); p.maxHp += 20; p.hp = p.maxHp;
        alert(`🎊 레벨 업! LV.${p.lv}`);
    }
    spawnMonster(); generateProblem(); updateUI(); saveData();
}

function spawnMonster() {
    const lv = gameState.player.lv;
    let availableMonsters = monsterData.filter(m => lv >= m.reqLv);
    const rand = availableMonsters[Math.floor(Math.random() * availableMonsters.length)];
    
    gameState.currentMonster = { name: rand.name, sprite: rand.sprite, maxHp: 36 + (lv * 18) + Math.floor(lv * lv * 0.012) };
    gameState.currentMonster.hp = gameState.currentMonster.maxHp;
    
    document.getElementById('m-name').innerText = gameState.currentMonster.name;
    document.getElementById('m-sprite').innerText = gameState.currentMonster.sprite;
    updateUI();
}

function renderShop() {
    let html = "";
    shopItems.forEach(item => {
        let tagClass = item.type === 'w' ? 'tag-w' : (item.type === 'a' ? 'tag-a' : (item.type === 'x' ? 'tag-x' : 'tag-e'));
        let typeName = item.type === 'w' ? '무기' : (item.type === 'a' ? '방어구' : (item.type === 'x' ? '장신구' : '유물'));
        let effectDesc = item.type === 'w' ? `공격력 ${item.val}` : (item.type === 'a' ? `콤보+${item.val}%` : (item.type === 'x' ? `보너스 ${item.val}초` : `경험치+${item.val}%`));
        
        html += `<div class="card"><div style="flex:1;"><span class="tag ${tagClass}">${typeName} ${item.icon}</span><br><b>${item.name}</b><br><small>${item.desc}</small><br><b>효과: ${effectDesc}</b></div><button class="action-btn" style="background:#4caf50;" onclick="buyItem('${item.name}')">${item.price}G</button></div>`;
    });
    document.getElementById('shop-list').innerHTML = html;
}

window.buyItem = function(itemName) {
    const item = shopItems.find(i => i.name === itemName);
    const p = gameState.player;
    
    let isBetter = (item.type === 'w' && item.val > p.atk) || (item.type === 'a' && item.val > p.comboRate) || (item.type === 'x' && item.val > p.bonusTime) || (item.type === 'e' && item.val > p.expBonus);
    if(!isBetter) return alert("⚠️ 이미 더 좋은 장비를 장착 중입니다!");
    
    if(p.gold >= item.price) {
        p.gold -= item.price;
        if(item.type === 'w') { p.weapon = item.name; p.atk = item.val; }
        else if(item.type === 'a') { p.armor = item.name; p.comboRate = item.val; }
        else if(item.type === 'x') { p.acc = item.name; p.bonusTime = item.val; }
        else { p.expItem = item.name; p.expBonus = item.val; }
        
        saveData(); updateUI(); renderShop();
        alert(`✨ ${item.name} 장착 완료!`);
    } else alert("❌ 골드가 부족합니다!");
};

function renderCollection() {
    const p = gameState.player;
    document.getElementById('collection-grid').innerHTML = monsterData.map(m => {
        const killed = p.collection[m.name] || 0;
        return `<div class="card" style="flex-direction:column; text-align:center;"><div style="font-size:3.5em;">${killed > 0 ? m.sprite : '❓'}</div><b>${killed > 0 ? m.name : '???'}</b><br><small>${killed > 0 ? m.desc : '🔒 LV.' + m.reqLv + ' 해금'}</small><br><div style="color:var(--a);">처치: ${killed}마리</div></div>`;
    }).join('');
}

window.showScreen = function(screenName) {
    document.querySelectorAll('.panel > div').forEach(div => { if(div.id.startsWith('screen-')) div.classList.add('hidden'); });
    document.getElementById('screen-' + screenName).classList.remove('hidden');
    
    if(screenName === 'rank') switchRankTab('personal');
    if(screenName === 'shop') renderShop();
    if(screenName === 'collection') renderCollection();
};

window.switchRankTab = async function(tabName) {
    document.getElementById('tab-personal').classList.toggle('active', tabName === 'personal');
    document.getElementById('tab-daily').classList.toggle('active', tabName === 'daily');
    document.getElementById('tab-school').classList.toggle('active', tabName === 'school');
    
    document.getElementById('rank-list').classList.toggle('hidden', tabName !== 'personal');
    document.getElementById('daily-rank-list').classList.toggle('hidden', tabName !== 'daily');
    document.getElementById('school-rank-list').classList.toggle('hidden', tabName !== 'school');
    
    if(tabName === 'personal') {
        const rankList = document.getElementById('rank-list'); rankList.innerHTML = "<p>로딩 중...</p>";
        const snap = await get(query(ref(db, 'leaderboard'), orderByChild('lv'), limitToLast(50)));
        let list = []; snap.forEach(c => { if(c.val().lv) list.push(c.val()); });
        list.sort((a,b) => b.lv - a.lv);
        rankList.innerHTML = list.map((p, i) => {
            let nick = leaderboardNicknameDisplay(p.nickname, p.isSecret !== false);
            return `<div class="card"><span><b>${i+1}등</b>. ${p.school} [${nick}]</span><b style="color:var(--a);">LV.${p.lv}</b></div>`;
        }).join('');
    } 
    else if(tabName === 'daily') {
        const dailyList = document.getElementById('daily-rank-list'); dailyList.innerHTML = "<p>집계 중...</p>";
        const today = new Date().toLocaleDateString();
        // 💡 안정성 패치: 활동 유저 누락 방지를 위해 최대 500명을 불러와서 필터링 후 10명 추출
        const snap = await get(query(ref(db, 'leaderboard'), orderByChild('todayAns'), limitToLast(500)));
        let list = []; snap.forEach(c => { const p = c.val(); if(p.lastDate === today && p.todayAns > 0) list.push(p); });
        list.sort((a,b) => b.todayAns - a.todayAns);
        list = list.slice(0, 10);
        dailyList.innerHTML = list.length > 0 ? list.map((p, i) => {
            let nick = leaderboardNicknameDisplay(p.nickname, p.isSecret !== false);
            return `<div class="card"><span><b>🔥 ${i+1}위</b>. ${nick}</span><b style="color:var(--a);">${p.todayAns}개</b></div>`;
        }).join('') : "<p style='text-align:center;'>아직 오늘 정답을 맞힌 용사가 없습니다!</p>";
    } 
    else {
        const schoolList = document.getElementById('school-rank-list'); schoolList.innerHTML = "<p>집계 중...</p>";
        const snap = await get(query(ref(db, 'leaderboard'), orderByChild('lv'), limitToLast(1500)));
        const total = {}; snap.forEach(c => { const p = c.val(); if(p.school) total[p.school] = (total[p.school] || 0) + (p.lv || 0); });
        const sorted = Object.entries(total).sort((a,b) => b[1] - a[1]).slice(0, 30);
        schoolList.innerHTML = sorted.map((s, i) => `<div class="card"><span><b>${i+1}위</b>. ${s[0]}</span><b style="color:var(--a);">${s[1]} LV</b></div>`).join('');
    }
};

function updateUI() {
    const p = gameState.player;
    document.getElementById('hero-nickname').innerText = p.nickname;
    document.getElementById('lv').innerText = p.lv;
    document.getElementById('gold').innerText = p.gold;
    document.getElementById('today-ans-text').innerText = p.todayAns || 0;
    document.getElementById('hp-text').innerText = `${Math.max(0, p.hp)}/${p.maxHp}`;
    document.getElementById('atk-val').innerText = p.atk;
    document.getElementById('combo-val').innerText = p.comboRate;
    document.getElementById('time-val').innerText = p.bonusTime;
    document.getElementById('exp-val').innerText = p.expBonus || 0;
    
    document.getElementById('hp-bar-fill').style.width = (p.hp / p.maxHp * 100) + "%";
    document.getElementById('m-hp-fill').style.width = (gameState.currentMonster.hp / gameState.currentMonster.maxHp * 100) + "%";
    
    const comboBadge = document.getElementById('combo-badge');
    if(p.curCombo > 0) {
        comboBadge.innerText = p.curCombo + " COMBO!";
        comboBadge.style.display = 'block';
    } else {
        comboBadge.style.display = 'none';
    }
}
</script>
