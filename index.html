<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>소수의 나눗셈 용사</title>
    <style>
        /* 🎨 디자인 컨셉: 밝고 명쾌한 게임 테마 */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        :root { --p: #b3e5fc; --s: #ffeb3b; --a: #ff5252; --t: #5d4037; --bg: #f0f9ff; }
        * { box-sizing: border-box; }
        body { font-family: 'Jua', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 0; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* 상단 로그인 바 */
        #top-bar { background: #ffffff; padding: 10px 15px; border-bottom: 5px solid var(--p); display: flex; justify-content: center; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #top-bar input { font-family: 'Jua'; padding: 8px; border: 3px solid var(--p); border-radius: 12px; text-align: center; width: 140px; font-size: 1rem; }
        .btn-start { background: var(--a); border: none; border-radius: 12px; color: white; padding: 8px 25px; cursor: pointer; font-family: 'Jua'; font-size: 1.1em; box-shadow: 0 4px 0 #d32f2f; }
        
        /* 공지사항 배너 (X버튼 포함) */
        #notice-banner { background-color: #ffebee; color: #c62828; text-align: center; padding: 10px; font-size: 0.9em; font-weight: bold; border-bottom: 2px solid #ef9a9a; position: relative; z-index: 999; }
        .close-notice { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; background: rgba(0,0,0,0.1); width: 22px; height: 22px; line-height: 20px; border-radius: 50%; font-size: 14px; }

        /* 게임 메인 컨테이너 */
        #game-container { display: flex; width: 100%; max-width: 1050px; margin: 15px auto; padding: 0 15px; gap: 20px; transition: all 0.8s ease; flex: 1; }
        .is-locked { filter: blur(8px) grayscale(80%); pointer-events: none; opacity: 0.4; }
        
        /* 공통 패널 스타일 */
        .panel { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 0 rgba(0,0,0,0.05); border: 6px solid var(--p); position: relative; }
        .hidden { display: none !important; }
        
        /* 랭킹 탭 디자인 */
        .rank-tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 100px; padding: 12px 5px; border: none; border-radius: 15px; font-family: 'Jua'; cursor: pointer; background: #eee; font-size: 0.95em; transition: 0.2s; }
        .tab-btn.active { background: var(--p); color: #1565c0; font-weight: bold; border: 2px solid #64b5f6; }
        
        /* 랭킹 리스트 */
        .rank-scroll { display: grid; grid-template-columns: 1fr; gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 5px; }
        .card { border: 3px solid var(--p); padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; background: #fdfdfd; font-size: 1.1em; }
        
        /* 몬스터 & 문제 영역 */
        #monster-area { padding: 20px; border-radius: 25px; text-align: center; margin-bottom: 15px; border: 5px solid #c8e6c9; background: #e8f5e9; }
        #problem-banner { background: #fff9c4; padding: 20px; border-radius: 20px; text-align: center; font-size: 3.5em; margin-bottom: 20px; border: 5px solid #fff176; }
        #answer-input { font-family: 'Jua'; font-size: 2em; padding: 10px; border-radius: 15px; border: 4px solid var(--p); width: 160px; text-align: center; }
        .btn-attack { background: var(--a); border: none; border-radius: 15px; color: white; padding: 10px 30px; font-size: 1.6em; cursor: pointer; font-family: 'Jua'; box-shadow: 0 5px 0 #d32f2f; margin-left: 10px; }

        @media screen and (max-width: 768px) { #game-container { flex-direction: column; } }
    </style>
</head>
<body>

<div id="top-bar">
    <input type="text" id="school-name" placeholder="학교 이름">
    <input type="text" id="user-nick" placeholder="닉네임">
    <button class="btn-start" onclick="processLogin()">모험 시작!</button>
</div>

<div id="notice-banner">
    📢 [긴급공지] 랭킹 시스템 업데이트! TOP 50 확대 및 '오늘의 정답왕'이 신설되었습니다!
    <span class="close-notice" onclick="this.parentElement.style.display='none'">X</span>
</div>

<div id="game-container" class="is-locked">
    <div id="status-panel" class="panel" style="flex: 1;">
        <center>
            <h2 id="hero-nickname" style="font-size: 2em; margin: 0;">용사 대기 중</h2>
            <div style="background:var(--s); padding:8px 20px; border-radius:20px; margin-top:10px;">LV. <span id="lv">1</span></div>
        </center>
        <hr style="border: 1px dashed var(--p); margin: 20px 0;">
        <p>💰 골드: <span id="gold">0</span> G</p>
        <p>🔥 오늘 정답: <span id="today-ans-cnt">0</span>개</p>
        <p style="font-size: 0.8em; color: #888;">(오늘의 정답은 매일 밤 12시 리셋!)</p>
        <hr>
        <button class="tab-btn active" style="width:100%; margin-bottom:10px; background:#66bb6a; color:white;" onclick="showScreen('battle')">⚔️ 전투하러 가기</button>
        <button class="tab-btn" style="width:100%; background:#42a5f5; color:white;" onclick="showScreen('rank')">🏆 랭킹보드 확인</button>
    </div>

    <div id="main-panel" class="panel" style="flex: 2.2;">
        <div id="screen-battle">
            <div id="monster-area">
                <div id="m-name" style="font-size: 1.5em; font-weight:bold;">야생의 몬스터</div>
                <div id="m-sprite" style="font-size: 5em;">🔒</div>
            </div>
            <div id="problem-banner"><span id="p-text">로그인 해주세요</span></div>
            <center>
                <input type="text" id="answer-input" placeholder="정답" onkeypress="if(event.keyCode==13) handleAttack()">
                <button class="btn-attack" onclick="handleAttack()">공격!</button>
            </center>
        </div>

        <div id="screen-rank" class="hidden">
            <h2 style="text-align:center; margin-top:0;">🏆 전국 용사 랭킹 🏆</h2>
            <div class="rank-tabs">
                <button class="tab-btn active" id="tab-personal" onclick="switchRankTab('personal')">👤 개인 TOP 50</button>
                <button class="tab-btn" id="tab-daily" onclick="switchRankTab('daily')">🔥 오늘의 정답왕</button>
                <button class="tab-btn" id="tab-school" onclick="switchRankTab('school')">🏫 학교 대항전</button>
            </div>
            
            <div id="rank-list" class="rank-scroll"></div>
            <div id="daily-rank-list" class="rank-scroll hidden"></div>
            <div id="school-rank-list" class="rank-scroll hidden"></div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDUADGY2c1Y7BFQQVImgHqX92xjNbdGLXk",
    authDomain: "division-of-fractions.firebaseapp.com",
    projectId: "division-of-fractions",
    databaseURL: "https://division-of-fractions-default-rtdb.asia-southeast1.firebasedatabase.app/",
    storageBucket: "division-of-fractions.firebasestorage.app",
    messagingSenderId: "549398586980",
    appId: "1:549398586980:web:8af75b0d03c87eec39a171"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let player = { nickname: "", school: "", lv: 1, gold: 0, todayAns: 0, lastDate: "" };
let isLogged = false;
let curProb = { q: "1.2 ÷ 0.3", a: 4 };

// 💡 로그인 및 날짜 체크 (오늘 정답수 리셋 로직)
window.processLogin = async function() {
    const school = document.getElementById('school-name').value.trim();
    const nick = document.getElementById('user-nick').value.trim();
    if(!school || !nick) return alert("학교와 닉네임을 입력해줘!");

    const today = new Date().toLocaleDateString();
    const userID = `${school}-${nick}`;
    const snap = await get(ref(db, 'players/' + userID));

    if(snap.exists()) {
        player = snap.val();
        // 💡 날짜가 바뀌었으면 오늘 정답수 초기화
        if(player.lastDate !== today) {
            player.todayAns = 0;
            player.lastDate = today;
        }
    } else {
        player = { nickname: nick, school: school, lv: 1, gold: 0, todayAns: 0, lastDate: today };
    }

    isLogged = true;
    document.getElementById('game-container').classList.remove('is-locked');
    document.getElementById('hero-nickname').innerText = player.nickname;
    document.getElementById('lv').innerText = player.lv;
    document.getElementById('gold').innerText = player.gold;
    document.getElementById('today-ans-cnt').innerText = player.todayAns;
    document.getElementById('p-text').innerText = curProb.q;
    document.getElementById('m-sprite').innerText = "👾";
};

// 💡 공격 성공 시 '오늘 정답수' 증가
window.handleAttack = function() {
    if(!isLogged) return;
    const ans = parseFloat(document.getElementById('answer-input').value);
    if(ans === curProb.a) {
        player.todayAns++;
        player.gold += 10;
        alert("정답! 몬스터 처치!");
        saveData();
        // 실제 게임에선 여기서 다음 문제 생성 로직 추가
    } else {
        alert("틀렸어! 다시 풀어보자.");
    }
    document.getElementById('answer-input').value = "";
    document.getElementById('today-ans-cnt').innerText = player.todayAns;
    document.getElementById('gold').innerText = player.gold;
};

// 💡 개인 TOP 50 랭킹 (레벨 순)
window.renderPersonalRank = async function() {
    const listEl = document.getElementById('rank-list');
    listEl.innerHTML = "로딩 중...";
    const q = query(ref(db, 'players'), orderByChild('lv'), limitToLast(50));
    const snap = await get(q);
    let list = [];
    snap.forEach(c => list.push(c.val()));
    list.sort((a,b) => b.lv - a.lv);
    listEl.innerHTML = list.map((p, i) => `
        <div class="card">
            <span><b>${i+1}위</b> ${p.school} [${p.nickname}]</span>
            <b>LV.${p.lv}</b>
        </div>`).join('');
};

// 💡 오늘의 정답왕 랭킹 (오늘 정답수 순)
window.renderDailyRank = async function() {
    const listEl = document.getElementById('daily-rank-list');
    listEl.innerHTML = "오늘의 열기 로딩 중...";
    const today = new Date().toLocaleDateString();
    const q = query(ref(db, 'players'), orderByChild('todayAns'), limitToLast(50));
    const snap = await get(q);
    let list = [];
    snap.forEach(c => {
        const p = c.val();
        if(p.lastDate === today && p.todayAns > 0) list.push(p);
    });
    list.sort((a,b) => b.todayAns - a.todayAns);
    listEl.innerHTML = list.map((p, i) => `
        <div class="card">
            <span><b>🔥 ${i+1}위</b> ${p.nickname} 용사</span>
            <b>${p.todayAns}개</b>
        </div>`).join('');
};

// 💡 학교 대항전 (학교별 레벨 합계)
window.renderSchoolRank = async function() {
    const listEl = document.getElementById('school-rank-list');
    listEl.innerHTML = "학교 자부심 로딩 중...";
    const snap = await get(ref(db, 'players'));
    const schools = {};
    snap.forEach(c => {
        const p = c.val();
        schools[p.school] = (schools[p.school] || 0) + p.lv;
    });
    const sorted = Object.entries(schools).sort((a,b) => b[1] - a[1]).slice(0, 30);
    listEl.innerHTML = sorted.map(([name, sum], i) => `
        <div class="card">
            <span><b>${i+1}위</b> ${name}</span>
            <b>${sum} 점</b>
        </div>`).join('');
};

// 탭 전환 로직
window.switchRankTab = function(tab) {
    document.getElementById('rank-list').classList.toggle('hidden', tab !== 'personal');
    document.getElementById('daily-rank-list').classList.toggle('hidden', tab !== 'daily');
    document.getElementById('school-rank-list').classList.toggle('hidden', tab !== 'school');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    
    if(tab === 'personal') renderPersonalRank();
    else if(tab === 'daily') renderDailyRank();
    else renderSchoolRank();
};

window.showScreen = function(screen) {
    document.getElementById('screen-battle').classList.toggle('hidden', screen !== 'battle');
    document.getElementById('screen-rank').classList.toggle('hidden', screen !== 'rank');
    if(screen === 'rank') renderPersonalRank();
};

function saveData() {
    set(ref(db, 'players/' + `${player.school}-${player.nickname}`), player);
}
</script>
</body>
</html>
